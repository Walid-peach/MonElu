# MonÉlu local infrastructure — Postgres 15 (pgvector) + pgAdmin 8 only.
# Schema is applied by `make migrate` (scripts/migrate.py) — the same mechanism
# production uses — not by the Postgres initdb hook.
#
# The experimental Airflow/MinIO stack lives in docker-compose.airflow.yml:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: monelu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monelu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monelu}
      POSTGRES_DB: ${POSTGRES_DB:-monelu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monelu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: monelu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@monelu.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_local_dev}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

volumes:
  postgres_data:
  pgadmin_data:
