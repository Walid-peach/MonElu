services:
  postgres:
    image: postgres:15
    container_name: monelu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monelu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monelu}
      POSTGRES_DB: ${POSTGRES_DB:-monelu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monelu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: monelu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@monelu.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_local_dev}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow_local_dev}
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  airflow-init:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_local_dev}@postgres-airflow/airflow
      # dev-only Fernet key — set AIRFLOW_FERNET_KEY in .env to override in production
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-WHXUzrK0dY11atB_ORjCHFQ2S9B4_4ovITdpye6T4t4=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "airflow db migrate && (airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-airflow_local_dev} --firstname Admin --lastname Admin --role Admin --email admin@monelu.fr || true)"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  airflow-webserver:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_local_dev}@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-WHXUzrK0dY11atB_ORjCHFQ2S9B4_4ovITdpye6T4t4=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  airflow-scheduler:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_local_dev}@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-WHXUzrK0dY11atB_ORjCHFQ2S9B4_4ovITdpye6T4t4=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

volumes:
  postgres_data:
  pgadmin_data:
  postgres-airflow-data:
  minio-data:
