services:
  postgres:
    image: postgres:15
    container_name: monelu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monelu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monelu}
      POSTGRES_DB: ${POSTGRES_DB:-monelu}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monelu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: monelu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@monelu.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''  # TODO: set a real Fernet key for staging/prod
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@monelu.fr || true)"

  airflow-webserver:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''  # TODO: set a real Fernet key for staging/prod
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3

  airflow-scheduler:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''  # TODO: set a real Fernet key for staging/prod
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL}
      AN_API_BASE_URL: ${AN_API_BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./ingestion/dags:/opt/airflow/dags
      - ./ingestion/operators:/opt/airflow/operators
      - ./ingestion/utils:/opt/airflow/utils
      - ./quality:/opt/airflow/quality
      - ./scripts:/opt/airflow/scripts
      - ./logs/airflow:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      retries: 3

volumes:
  postgres_data:
  pgadmin_data:
  postgres-airflow-data:
  minio-data:
