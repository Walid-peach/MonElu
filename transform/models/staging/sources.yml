version: 2

sources:
  - name: raw
    description: "Raw tables ingested from Assemblée Nationale open data"
    schema: public
    tables:
      - name: deputies
        description: "577 French deputies — profiles, party, department"
        loaded_at_field: ingested_at
        freshness:
          # Deputies are re-upserted on every successful run (recess or not),
          # so this source is the "cron silently died" detector.
          warn_after: { count: 4, period: day }
          error_after: { count: 7, period: day }
        columns:
          - name: deputy_id
            description: "Unique deputy identifier (e.g. PA722190)"
            tests:
              - not_null
              - unique
          - name: full_name
            tests:
              - not_null
          - name: party
            description: "Parliamentary group name"
          - name: department
            description: "Full department name (e.g. Yvelines)"

      - name: votes
        description: "All parliamentary votes (scrutins)"
        loaded_at_field: ingested_at
        freshness:
          # Upserts only touch votes inside the ingestion --since window, so a
          # long parliamentary recess legitimately stalls this timestamp; the
          # wide error window avoids August false alarms. Cron death itself is
          # caught by the deputies source, whose rows refresh on every run.
          warn_after: { count: 4, period: day }
          error_after: { count: 30, period: day }
        columns:
          - name: vote_id
            tests:
              - not_null
              - unique
          - name: voted_at
            description: >
              Nullable by design (MON-13, ADR-031) - stg_votes drops null-dated
              rows before the marts, so this test is a warn-only anomaly alert.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: result
            tests:
              - not_null
              - accepted_values:
                  values: ['adopté', 'rejeté']

      - name: vote_positions
        description: "Individual deputy positions on each vote"
        loaded_at_field: ingested_at
        freshness:
          # Same recess caveat as votes — see above.
          warn_after: { count: 4, period: day }
          error_after: { count: 30, period: day }
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - vote_id
                - deputy_id
        columns:
          - name: vote_id
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'votes')
                  field: vote_id
          - name: deputy_id
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'deputies')
                  field: deputy_id
          - name: position
            description: >
              Raw AN value — camelCase 'nonVotant' is intentional here.
              stg_vote_positions normalises to lowercase; the staging schema
              test uses 'nonvotant' to match the transformed value.
            tests:
              - not_null
              - accepted_values:
                  values: ['pour', 'contre', 'abstention', 'nonVotant']
