version: 2

sources:
  - name: raw
    description: "Raw tables ingested from Assemblée Nationale open data"
    schema: public
    tables:
      - name: deputies
        description: "577 French deputies — profiles, party, department"
        loaded_at_field: ingested_at
        freshness:
          # Deputy rows change rarely (re-upserted on ingestion runs); generous
          # windows avoid false alarms during parliamentary recess.
          warn_after: { count: 7, period: day }
          error_after: { count: 30, period: day }
        columns:
          - name: deputy_id
            description: "Unique deputy identifier (e.g. PA722190)"
            tests:
              - not_null
              - unique
          - name: full_name
            tests:
              - not_null
          - name: party
            description: "Parliamentary group name"
          - name: department
            description: "Full department name (e.g. Yvelines)"

      - name: votes
        description: "All parliamentary votes (scrutins)"
        loaded_at_field: ingested_at
        freshness:
          # Cron ingests weekdays at 06:00 UTC; warn after a missed run-plus-
          # weekend, error after a full week of silence (the "cron silently
          # died" failure mode).
          warn_after: { count: 4, period: day }
          error_after: { count: 7, period: day }
        columns:
          - name: vote_id
            tests:
              - not_null
              - unique
          - name: voted_at
            tests:
              - not_null
          - name: result
            tests:
              - not_null
              - accepted_values:
                  values: ['adopté', 'rejeté']

      - name: vote_positions
        description: "Individual deputy positions on each vote"
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 4, period: day }
          error_after: { count: 7, period: day }
        columns:
          - name: position_id
            tests:
              - not_null
              - unique
          - name: vote_id
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'votes')
                  field: vote_id
          - name: deputy_id
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'deputies')
                  field: deputy_id
          - name: position
            description: >
              Raw AN value — camelCase 'nonVotant' is intentional here.
              stg_vote_positions normalises to lowercase; the staging schema
              test uses 'nonvotant' to match the transformed value.
            tests:
              - not_null
              - accepted_values:
                  values: ['pour', 'contre', 'abstention', 'nonVotant']
