version: 2

models:
  - name: stg_deputies
    description: "Cleaned and renamed deputy profiles"
    columns:
      - name: deputy_id
        tests: [not_null, unique]
      - name: full_name
        tests: [not_null]
      - name: is_active
        tests: [not_null]
      - name: party
        description: >
          Canonical 17th-legislature parliamentary group label. Keep this
          list in sync with CANONICAL_LABELS in scripts/backfill_party_labels.py.
          NULL is allowed (deputies whose group was never resolved); any
          other label means the ingestion pipeline is fragmenting the
          party dimension again.
        tests:
          - accepted_values:
              values:
                - 'Rassemblement National'
                - 'Ensemble pour la République'
                - 'La France insoumise - Nouveau Front Populaire'
                - 'Socialistes et apparentés'
                - 'Droite Républicaine'
                - 'Écologiste et Social'
                - 'Les Démocrates'
                - 'Horizons & Indépendants'
                - 'Libertés, Indépendants, Outre-mer et Territoires'
                - 'Union des droites pour la République'
                - 'Gauche Démocrate et Républicaine'
                - 'Non inscrit'
              config:
                where: "party is not null"

  - name: stg_votes
    description: "Cleaned and typed vote records"
    columns:
      - name: vote_id
        tests: [not_null, unique]
      - name: voted_at
        tests: [not_null]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ['adopté', 'rejeté']
      - name: is_adopted
        tests: [not_null]

  - name: stg_vote_positions
    description: "Cleaned individual vote positions"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - vote_id
            - deputy_id
    columns:
      - name: position
        tests:
          - not_null
          - accepted_values:
              values: ['pour', 'contre', 'abstention', 'nonvotant']
      - name: vote_id
        tests:
          - relationships:
              to: ref('stg_votes')
              field: vote_id
      - name: deputy_id
        tests:
          - relationships:
              to: ref('stg_deputies')
              field: deputy_id
