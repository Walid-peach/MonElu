version: 2

models:
  - name: mart_deputy_scorecard
    description: "One row per deputy — presence rate, vote breakdown, party info"
    tests:
      - dbt_utils.recency:
          arguments:
            datepart: day
            field: updated_at
            interval: 1
    columns:
      - name: deputy_id
        tests: [not_null, unique]
      - name: presence_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: votes_for_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: abstention_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: total_votes_cast
        tests: [not_null]

  - name: mart_vote_summary
    description: "One row per vote — result, participation, pct breakdown"
    columns:
      - name: vote_id
        tests: [not_null, unique]
      - name: result
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['adopté', 'rejeté']
      - name: pct_pour
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_party_alignment
    description: "Deputy alignment with party majority vote"
    columns:
      - name: deputy_id
        tests: [not_null, unique]
      - name: party_alignment_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: dissident_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
