# Subflow: accept iOS's "Open in MonÉlu?" prompt after `openLink` with a
# monelu:// link, in English or French, if it is showing. iOS does not always
# ask, so each tap runs only when its button is visible: an optional tapOn
# would wait out its whole timeout for a prompt that never comes. Not a flow
# to run on its own.
appId: ${APP_ID}
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
