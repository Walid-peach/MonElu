# Smoke flow (#450, #477, #488): launch the app and visit every tab,
# screenshotting each, and Explorer's two lists from its contents page.
# Tabs are tapped by their visible label and checked by the screen's
# accessibility id (`screen.<name>`): the tab bar shows every label all the
# time, so a label cannot prove the screen changed.
# Run it through `make ios-flow FLOW=tabs` (or `make ios-smoke`), which passes
# APP_ID and SCREENSHOT_PREFIX and runs it once in light and once in dark mode.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000
- assertVisible:
    id: "screen.home"
- takeScreenshot: ${SCREENSHOT_PREFIX}1-accueil

- tapOn: "Explorer"
- assertVisible:
    id: "screen.explore"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-explorer

# The contents page's own id masks the tiles' ids, so a tile is tapped by
# its label, which reads its title then its detail.
- tapOn: "Votes, .*"
- extendedWaitUntil:
    visible:
      id: "screen.votes"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_PREFIX}3-explorer-votes
- tapOn: "Explorer"
- tapOn: "Députés, .*"
- extendedWaitUntil:
    visible:
      id: "screen.deputies"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_PREFIX}3-explorer-deputes

- tapOn: "Quiz"
- assertVisible:
    id: "screen.quiz"
- takeScreenshot: ${SCREENSHOT_PREFIX}4-quiz

- tapOn: "Demander"
- assertVisible:
    id: "screen.ask"
- takeScreenshot: ${SCREENSHOT_PREFIX}5-demander
