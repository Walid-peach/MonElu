# Explorer's deputies (#462, #477, #488): the list loads from the API by
# surname, the group chip and "En mandat" narrow it, and a row opens the
# deputy's profile. Asserts on structure and fixed
# labels, not on who is listed: the data changes with each ingestion.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000

- tapOn: "Explorer"
- tapOn: "Députés, .*"
- extendedWaitUntil:
    visible:
      id: "deputy.row"
    timeout: 20000
- assertVisible: "Tous les groupes"
# The list opens on current mandates (#523).
- extendedWaitUntil:
    visible: ".* en mandat"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-deputies-list

# The screen's id masks the chips', so they are tapped by their labels.
- tapOn: "Tous les groupes"
- tapOn: "Rassemblement National"
- extendedWaitUntil:
    visible:
      id: "deputy.row"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-deputies-group

- tapOn:
    id: "deputy.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "deputy.profile"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3-deputy-profile
# The profile's own id masks ids nested inside it, so sections are found by
# their visible titles.
- scrollUntilVisible:
    element: "Présence aux scrutins"
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENSHOT_PREFIX}4-deputy-presence
- scrollUntilVisible:
    element: "Votes récents"
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENSHOT_PREFIX}5-deputy-votes
