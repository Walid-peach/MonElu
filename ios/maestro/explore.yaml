# Explorer's contents page (#488): the bills with a page and every
# département, each opening its own page. Live data: asserts on fixed labels
# and ids, never on which bills or deputies are listed.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000
- tapOn: "Explorer"
- extendedWaitUntil:
    visible: ".*en mandat.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-explore

# The contents page's id masks the tiles', so they are tapped by label.
- tapOn: "Textes, .*"
- extendedWaitUntil:
    visible:
      id: "loi.row"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-lois
- tapOn:
    id: "loi.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "loi.page"
    timeout: 20000

- tapOn: "Explorer"
- scrollUntilVisible:
    element: "Tous les départements"
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENSHOT_PREFIX}3-explore-lower
- tapOn: "Tous les départements"
- extendedWaitUntil:
    visible:
      id: "department.row"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}4-departements
- tapOn:
    id: "department.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "department.page"
    timeout: 20000

# The search (#521): a département name finds it among the results, which
# open its page. Deputies and votes found for the same query vary with the
# day's data, so only the département is asserted.
# Back at the contents page, still scrolled down; the field stays pinned.
- tapOn: "Explorer"
- extendedWaitUntil:
    visible: "Vote, député, texte, commune"
    timeout: 10000
- tapOn: "Vote, député, texte, commune"
- inputText: "Gironde"
- extendedWaitUntil:
    visible: "Gironde \\(33\\)"
    timeout: 20000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}5-search
- tapOn: "Gironde \\(33\\)"
- extendedWaitUntil:
    visible:
      id: "department.page"
    timeout: 20000
