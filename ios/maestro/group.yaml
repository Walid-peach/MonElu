# The group page (#484): a link opens a group, a member opens their
# profile, and that profile's group opens the group again. Explorer's
# groups lead there too. Live data: asserts on fixed labels only.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      MonEluOpenURL: "monelu://groupes/lfi-nfp"
- extendedWaitUntil:
    visible: "Les plus souvent en désaccord avec le groupe"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-group-top
- scrollUntilVisible:
    element: "Quand le groupe s'est divisé"
    direction: DOWN

# The member search's placeholder is not visible text to Maestro, so the
# section is found by its header, which counts the members.
- scrollUntilVisible:
    element: "Les .* membres"
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENSHOT_PREFIX}2-group-members

# Explorer's groups, by seats, open each group's page (#488).
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000
- tapOn: "Explorer"
- scrollUntilVisible:
    element: ".*Rassemblement National.*"
    direction: DOWN
    centerElement: true
- tapOn: ".*Rassemblement National.*"
- extendedWaitUntil:
    visible: "Les plus souvent en désaccord avec le groupe"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3-group-from-explorer
