# Explorer's votes (#460, #477): the list loads from the API, and a row opens
# its detail.
# Asserts on structure, not on wording: the scrutins themselves change daily.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000

- tapOn: "Explorer"
- extendedWaitUntil:
    visible:
      id: "vote.row"
    timeout: 20000
- assertVisible: "Tous"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-votes-list

- tapOn: "Adoptés"
- extendedWaitUntil:
    visible:
      id: "vote.row"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-votes-adopted

- tapOn:
    id: "vote.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "vote.detail"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3-vote-detail
# The chart is one accessibility element labelled "Hémicycle" (what VoiceOver
# reads); the screen's own id masks ids nested inside it.
- scrollUntilVisible:
    element: "Hémicycle"
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENSHOT_PREFIX}4-vote-hemicycle
- scrollUntilVisible:
    element: "Positions par groupe"
    direction: DOWN
- takeScreenshot: ${SCREENSHOT_PREFIX}5-vote-positions
