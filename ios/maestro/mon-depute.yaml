# Mon député tab (#463): a postal code finds the département's deputies, the
# chosen one is kept on the device, and a relaunch opens on their home.
# Asserts on fixed labels, not on who is listed: rosters change.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Trouvez votre député"
    timeout: 15000

# Four digits are refused before anything is sent.
- tapOn: "Code postal"
- inputText: "3300"
- tapOn: "Rechercher"
- assertVisible: "Un code postal compte cinq chiffres."
- takeScreenshot: ${SCREENSHOT_PREFIX}1-postal-invalid

- tapOn: "3300"
- eraseText: 4
- inputText: "33000"
- tapOn: "Rechercher"
- extendedWaitUntil:
    visible: "Gironde (33)"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-postal-results

# A row reads as the deputy's name, group and seat; the 1st seat is stable.
- tapOn: ".*Gironde · 1re circonscription.*"
- extendedWaitUntil:
    visible: "Depuis votre dernière visite"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3-home-first-visit

# The choice survives a relaunch, which opens straight on the home.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Depuis votre dernière visite"
    timeout: 20000
- assertNotVisible: "Trouvez votre député"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}4-home-relaunch

- tapOn: "Options"
- tapOn: "Ne plus suivre"
- extendedWaitUntil:
    visible: "Trouvez votre député"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_PREFIX}5-unfollowed
