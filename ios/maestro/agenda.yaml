# The agenda (#483): opened from Explorer's "Agenda" tile (#488), it loads this week from
# the API, and the week buttons move it. Live data: asserts on fixed labels,
# never on the day's points. The week label is one accessibility element
# with its dates, so it is matched by pattern.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000
- tapOn: "Explorer"
- tapOn: "Agenda, .*"
- extendedWaitUntil:
    visible: ".*heures de Paris.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-agenda-week

- tapOn: "Semaine précédente"
- extendedWaitUntil:
    visible: ".*Semaine dernière.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}2-agenda-previous-week

# Accueil opens it too.
- tapOn: "Accueil"
- tapOn:
    id: "open.agenda"
- extendedWaitUntil:
    visible: ".*Cette semaine.*"
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_PREFIX}3-agenda-from-home

# A point whose bill has a page opens it in the app (#511), when this week
# has one: most weeks' bills have no scrutin yet, so it is not asserted.
- runFlow:
    when:
      visible:
        id: "agenda.entry.loi"
    commands:
      - tapOn:
          id: "agenda.entry.loi"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "loi.page"
          timeout: 20000
      - waitForAnimationToEnd
      - takeScreenshot: ${SCREENSHOT_PREFIX}4-agenda-bill
