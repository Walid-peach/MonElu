# Accueil (#463, #477, #491, #565, ADR-042): a clean install opens on the
# feed, on « À l'Assemblée », with only « + Suivre » in the follows row
# (#575); « Pour vous » is empty with its follow prompt, which opens the
# postal-code search; a code finds the département's deputies, a tap selects
# one and the pinned "Suivre" follows them, the choice is kept on the device,
# a relaunch opens on « Pour vous », and the quiz invitation at the end of the
# feed leads to the quiz and back. Unfollowing goes back to the empty feed,
# never to the search. A deputy followed on
# their profile then reaches Accueil without a relaunch (#576); a second one
# added from « + Suivre » gets a circle of their own (#585), and unfollowing
# one on Accueil reaches the profile left open on Explorer.
# Asserts on fixed labels, not on who is listed: rosters change. A deputy's
# circle reads "<name>, député suivi" to VoiceOver, which is what is matched.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "À l'Assemblée"
      selected: true
    timeout: 20000
- assertVisible: "Suivre un député ou un thème"
- assertNotVisible: ".*député suivi"
- assertNotVisible: "Code postal"
- assertNotVisible: "Chargement impossible"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1-first-visit

# « Pour vous » is empty by design and prompts a follow (ADR-042 §4).
- tapOn: "Pour vous"
- extendedWaitUntil:
    visible: "Vous ne suivez encore rien.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1b-pour-vous-empty

# The prompt opens the postal-code search.
- tapOn: "Trouvez votre député.*"
- extendedWaitUntil:
    visible: "Code postal"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}1c-picker

# Four digits are refused before anything is sent.
- tapOn: "Code postal"
- inputText: "3300"
- tapOn: "Rechercher"
- assertVisible: "Un code postal compte cinq chiffres."
- takeScreenshot: ${SCREENSHOT_PREFIX}2-postal-invalid

- tapOn: "3300"
- eraseText: 4
- inputText: "33000"
- tapOn: "Rechercher"
- extendedWaitUntil:
    visible: ".*Gironde \\(33\\).*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3-postal-results

# A row reads as the deputy's name, group and seat; the 1st seat is stable.
- tapOn: ".*1re circonscription.*"
- extendedWaitUntil:
    visible: "Suivre .*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}3b-postal-selected
# Tapped by its label: the button's frame is the red pill alone (#518), so
# its centre is no longer the Explorer tab under the bar.
- tapOn: "Suivre .*"
- extendedWaitUntil:
    visible: ".*député suivi"
    timeout: 20000
- assertNotVisible: "Code postal"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}4-home-feed

# The choice survives a relaunch, which opens straight on the feed.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Pour vous"
    timeout: 20000
- assertNotVisible: "Trouvez votre député"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}5-home-relaunch

# The other tab asks the API for the week's headline votes.
- tapOn: "À l'Assemblée"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}5b-home-assemblee
# Both tabs end on the quiz invitation, but « À l'Assemblée » lists every
# agenda item of the next seven days (ADR-042 §4): in a busy week it runs
# past the scroll's timeout. « Pour vous » holds one deputy's week.
# The invitation is the last element, so it can never be centred: asking
# for it scrolls until the timeout whenever the feed is short.
- tapOn: "Pour vous"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*Et si vous votiez.*"
    direction: DOWN
- takeScreenshot: ${SCREENSHOT_PREFIX}6-home-invitations

# The quiz invitation switches tabs.
- tapOn: ".*Et si vous votiez.*"
- assertVisible:
    id: "screen.quiz"
- tapOn: "Accueil"

- tapOn: "Options"
- tapOn: "Ne plus suivre .*"
- extendedWaitUntil:
    visible: "Vous ne suivez encore rien.*"
    timeout: 20000
- assertNotVisible: "Code postal"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}7-unfollowed

# Follow from a profile: Accueil leaves its follow prompt for the feed while the
# app stays open (#576).
- tapOn: "Explorer"
- tapOn: "Députés, .*"
- extendedWaitUntil:
    visible:
      id: "deputy.row"
    timeout: 20000
- tapOn:
    id: "deputy.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "deputy.profile"
    timeout: 20000
# The profile's id masks the button's, so it is tapped by its label.
- tapOn: "Suivre"
- assertVisible: "Suivi"
- tapOn: "Accueil"
- extendedWaitUntil:
    visible: "Pour vous"
    timeout: 20000
- assertNotVisible: "Trouvez votre député"
# The tabs alone would show over a failed load: the deputy's circle needs
# their profile, and the feed must not be an error.
- extendedWaitUntil:
    visible: ".*député suivi"
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible: "Chargement impossible"
- takeScreenshot: ${SCREENSHOT_PREFIX}8-followed-from-profile

# A second deputy, added from « + Suivre » by postal code: both are followed,
# each with a circle, and the feed asks the API for both (#585).
- tapOn: "Suivre un député ou un thème"
- tapOn: "Ajouter un député"
- extendedWaitUntil:
    visible: "Code postal"
    timeout: 5000
- tapOn: "Code postal"
- inputText: "33000"
- tapOn: "Rechercher"
- extendedWaitUntil:
    visible: ".*Gironde \\(33\\).*"
    timeout: 20000
- tapOn: ".*1re circonscription.*"
- tapOn: "Suivre .*"
- extendedWaitUntil:
    visible:
      text: ".*député suivi"
      index: 1
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible: "Chargement impossible"
- takeScreenshot: ${SCREENSHOT_PREFIX}9-two-deputies
# One scroll down to the cards: two deputies' week runs past any timeout
# to its end. The toolbar stays reachable from there.
- scroll
- waitForAnimationToEnd
- takeScreenshot: ${SCREENSHOT_PREFIX}9b-two-deputies-feed

# Unfollow the profile's deputy on Accueil, the first in the menu (they were
# followed first): the other stays, and the profile still open on Explorer
# offers "Suivre" again.
- tapOn: "Options"
- tapOn:
    text: "Ne plus suivre .*"
    index: 0
- extendedWaitUntil:
    notVisible:
      text: ".*député suivi"
      index: 1
    timeout: 20000
- assertVisible: ".*député suivi"
- tapOn: "Explorer"
- extendedWaitUntil:
    visible: "Suivre"
    timeout: 5000
- assertNotVisible: "Suivi"
