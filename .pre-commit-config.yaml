repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Maestro flows (ios/maestro/) are a config document plus a steps document.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # Preserve the approved 1024px iOS icon without lossy palette reduction.
        # The circonscription boundaries (ADR-047, about 10 MB) are generated by
        # scripts/export_circonscriptions.py and change only with a redistricting.
        exclude: ^(ios/MonElu/Resources/Assets\.xcassets/AppIcon\.appiconset/AppIcon\.png|data/geo/circonscriptions\.geojson)$
      - id: debug-statements        # blocks accidental breakpoint() / pdb

  # Secret detection — blocks API keys, tokens, credentials from being committed
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: \.env\.example$

  # Ruff — lint + format (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff                    # lint
        args: [--fix]
      - id: ruff-format             # format (black-compatible)
