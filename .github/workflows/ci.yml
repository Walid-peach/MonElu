name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy values so importing api.main (which builds OpenAI/Groq clients at
    # import time via the shared tests/conftest.py) succeeds. Unit tests never
    # call these services; the clients only validate that a key is present.
    env:
      OPENAI_API_KEY: "sk-ci-placeholder"  # pragma: allowlist secret
      GROQ_API_KEY: "gsk-ci-placeholder"  # pragma: allowlist secret
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"  # pragma: allowlist secret
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Secret scanning
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not integration"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration

      - name: Validate quiz vote_ids against production (MON-171)
        # Catches a typo'd vote_id in a quarterly quiz refresh before it
        # merges. Hits the public prod API (no secrets), same dependency the
        # frontend build already has on prod being reachable.
        run: python scripts/check_quiz_votes.py --api https://monelu-production.up.railway.app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-build-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            next-build-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build
        # Prerenders all SSG pages against the production API; src/lib/api.ts
        # already retries through the rate limiter, so this can take a few
        # minutes on a cold cache. This is the *only* build in the workflow -
        # playwright-smoke consumes its output rather than repeating it
        # (MON-252), so a PR costs production one full-site prerender.
        run: npm run build

      - name: Publish the build output for the smoke tier
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          # .next/cache is the webpack/Next build cache - 637 MB of the 694 MB
          # tree locally, and `next start` never reads it. Excluding it takes
          # the artifact to ~57 MB. The `actions/cache` step above is what
          # carries the cache between runs; this artifact only carries the
          # built app between jobs.
          path: |
            frontend/.next
            !frontend/.next/cache
          # .next is a dotfile directory, and upload-artifact@v4 skips hidden
          # paths unless told otherwise - without this the artifact is empty.
          include-hidden-files: true
          retention-days: 1

  playwright-smoke:
    # Renders real pages in a real browser so a `hidden md:flex` nav that's
    # actually still visible, or a mobile-width overflow, fails the PR
    # instead of shipping through jsdom-only tests (MON-241, MON-141/142).
    #
    # Depends on `frontend` for its build output rather than building again
    # (MON-252). Both jobs used to run a full production prerender in
    # parallel, so every PR pointed two concurrent full-site crawls at the
    # production API - which caps anonymous callers at 30 req/min per IP
    # (api/limiter.py) and already 429s under prerender load.
    #
    # Serialising the jobs does not cost wall-clock, because the build being
    # removed was the *cold* one - this job never had the .next/cache restore
    # the frontend job has. Measured across the two runs either side of the
    # change: this job went 3m38s -> 1m7s, and the tier's wall-clock 3m38s ->
    # 3m25s. Do not "restore parallelism" by adding a build back here.
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download the frontend build
        # `npm run start` needs .next; node_modules comes from `npm ci` above
        # and public/ from the checkout, so this is the only artifact needed.
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: frontend/.next

      - name: Verify the build output arrived
        # A silently empty or mis-rooted artifact would surface as a confusing
        # `next start` failure several minutes later; fail here instead.
        run: test -f .next/BUILD_ID && test -d .next/server && test -d .next/static

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  dbt-data-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: pip install "dbt-core>=1.9,<1.10" "dbt-postgres>=1.9,<1.10"

      - name: Create dbt profiles.yml
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_PORT: ${{ secrets.DBT_PORT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: python3 scripts/create_dbt_profile.py

      - name: Install dbt packages
        run: cd transform && dbt deps

      - name: Compile dbt models
        run: cd transform && dbt compile --profiles-dir . --target prod

      - name: Run dbt data-health check
        id: dbt_test
        continue-on-error: true
        shell: bash
        run: |
          cd transform
          dbt test --profiles-dir . --target prod --no-use-colors 2>&1 | tee test_output.txt

      - name: Comment PR with dbt data-health results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'dbt test results not available';
            try {
              output = fs.readFileSync('transform/test_output.txt', 'utf8');
              output = output.split('\n').slice(-25).join('\n');
            } catch (e) {}
            const outcome = '${{ steps.dbt_test.outcome }}';
            const status = outcome === 'success' ? '✅ passed' : '❌ failed';
            // Note: this validates prod data freshness, not the PR's model changes.
            // A failing check means prod data is unhealthy, not necessarily that
            // the PR is wrong. See MON-37 for full context.
            const existingComments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const marker = '<!-- dbt-data-health -->';
            const body = `${marker}\n## 🧪 dbt data-health check — ${status}\n\`\`\`\n${output}\n\`\`\`\n_Validates prod data health. A failure means current prod data is stale/broken, not necessarily that this PR is wrong._`;
            const existing = existingComments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # Data-health failures reflect prod data state, not PR correctness (MON-37).
      # The job posts results as a PR comment; it never blocks merge.
      - name: Summarize data-health outcome
        if: always()
        run: |
          outcome="${{ steps.dbt_test.outcome }}"
          if [ "$outcome" = "failure" ]; then
            echo "::warning::dbt data-health check found failing tests in prod — investigate separately, not blocking this PR."
          fi
