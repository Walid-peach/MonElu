name: iOS

# The iPhone app's checks (ADR-041 §8): build, Swift Testing and the snapshot
# tests in one job, the Maestro smoke flows in another, running in parallel.
# ci.yml skips PRs confined to ios/, so this workflow is what tests them.
#
# The path list is pinned by tests/unit/test_ios_ci_paths.py. `api/**` is in it
# because the app's client is generated from the API's spec, and
# `data/reference/**` because the app bundles that JSON.
#
# Timings behind this shape (#469): restoring a build cache cost 4 to 7 minutes
# and made the build no faster, so there is none; the smoke flows run in light
# mode only on PRs, since the snapshot tests already cover dark mode there.

on:
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - "api/**"
      - "data/reference/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "api/**"
      - "data/reference/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The snapshot reference images are rendered on exactly this Xcode, device and
  # runtime; another one renders text differently and every snapshot fails.
  XCODE_APP: /Applications/Xcode_27.0.app
  SIMULATOR_DEVICE: iPhone 18 Pro
  SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0

jobs:
  # Whether the change reaches the app itself. The smoke flows run against the
  # production API, so an API-only PR cannot be tested by them: that PR still
  # builds and tests the app (the client is generated from its spec), but
  # skips smoke.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(ios/|data/reference/|\.github/workflows/ios\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    # Xcode 27 is served only on this image (a GitHub public preview label).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in job-level `env`, so the build
      # root is exported from a step.
      - name: Set the build root
        run: echo "IOS_BUILD_ROOT=$RUNNER_TEMP/ios-build" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install the pinned Tuist (ios/mise.toml)
        uses: jdx/mise-action@v2
        with:
          working_directory: ios

      # Design-token and path checks that read ios/ files. ci.yml runs them too,
      # but skips PRs confined to ios/, which are exactly the ones that change
      # a color set. --noconftest: tests/conftest.py imports the whole API.
      # The runner's own Python is Homebrew-managed and refuses pip (PEP 668).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Design token checks
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest --noconftest -q tests/unit/test_ios_design_tokens.py tests/unit/test_ios_ci_paths.py

      - name: Create the Simulator
        run: |
          id=$(xcrun simctl create "CI $SIMULATOR_DEVICE" "$SIMULATOR_DEVICE" "$SIMULATOR_RUNTIME")
          xcrun simctl boot "$id"
          echo "IOS_SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          # xcodebuild forwards TEST_RUNNER_* variables into the test process
          # without the prefix: swift-snapshot-testing writes a failing
          # snapshot's actual image there.
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-artifacts
        run: make ios-test

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/ios-build/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  smoke:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Light only on a PR: the snapshot tests cover dark mode there. Both
      # appearances after a merge to master and on a manual run.
      IOS_APPEARANCES: ${{ github.event_name == 'pull_request' && 'light' || 'light dark' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the build root
        run: echo "IOS_BUILD_ROOT=$RUNNER_TEMP/ios-build" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install the pinned Tuist (ios/mise.toml)
        uses: jdx/mise-action@v2
        with:
          working_directory: ios

      - name: Create the Simulator
        run: |
          id=$(xcrun simctl create "CI $SIMULATOR_DEVICE" "$SIMULATOR_DEVICE" "$SIMULATOR_RUNTIME")
          xcrun simctl boot "$id"
          echo "IOS_SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      # Maestro runs on Java; ios/scripts/install-maestro.sh installs the
      # pinned CLI and checks its SHA-256.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Smoke flows
        run: make ios-smoke

      # Every run, not only failures: these are what a reviewer who does not
      # read Swift looks at (ios-run skill).
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ${{ runner.temp }}/ios-build/maestro
          if-no-files-found: ignore
