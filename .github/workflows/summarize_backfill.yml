# This is the single retry backstop for vote summaries: it sweeps every vote
# with summary_plain IS NULL, independent of ingest_prod.yml's --since window
# (MON-221). ingest_prod.yml (06:00 UTC) also runs generate_vote_summaries.py,
# scoped to that run's ingestion window, so a summary generated same-day
# doesn't wait a full day for this job — but this job, not that step, is what
# guarantees a summary eventually lands regardless of when it first failed.
#
# The '2024-07-07' bound below is the legislature start date, not the current
# Supabase free-tier horizon (2025-07-01, decision 7 in CLAUDE.md) — it is
# intentionally earlier than any vote can exist, so a future backfill to an
# earlier horizon does not silently leave older votes unsummarized here.
name: MonÉlu — Daily Summary Backfill

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily — one hour after Groq TPD reset at midnight UTC
  workflow_dispatch:        # Manual trigger

concurrency:
  group: summaries
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ingest.txt

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Check backlog
        id: backlog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          count=$(python3 -c "
          import psycopg2, os
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute(\"SELECT COUNT(*) FROM votes WHERE summary_plain IS NULL AND voted_at >= '2024-07-07'\")
          print(cur.fetchone()[0])
          conn.close()
          ")
          echo "remaining=$count" >> "$GITHUB_OUTPUT"
          echo "Votes without summaries: $count"

      - name: Run summarizer
        if: steps.backlog.outputs.remaining != '0'
        id: summarize
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Capturing the status is what is load-bearing here (GH #384), not
          # pipefail: `shell: bash` already runs with -eo pipefail, so a bare
          # failing pipeline would abort this step at the line above - before
          # the greps - and generated/errors would never reach GITHUB_OUTPUT,
          # leaving the job summary reporting 0/0 on exactly the runs that need
          # the counts. So: capture, publish, then re-raise at the end.
          # pipefail is still set explicitly so this keeps holding if the
          # `shell: bash` line is ever dropped (the default shell is `bash -e`,
          # without pipefail, and tee's exit code would then mask the failure).
          set -o pipefail
          status=0
          python -m scripts.generate_vote_summaries --since 2024-07-07 \
            --changed-ids-out /tmp/summarized_vote_ids.txt 2>&1 | tee /tmp/summary_run.log || status=$?
          generated=$(grep "Done —" /tmp/summary_run.log | grep -oP "generated: \K[0-9]+" || echo "0")
          errors=$(grep "Done —" /tmp/summary_run.log | grep -oP "errors: \K[0-9]+" || echo "0")
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          echo "errors=$errors"       >> "$GITHUB_OUTPUT"
          echo "Generated: $generated  Errors: $errors"
          if [ "$status" -ne 0 ]; then
            echo "::error::Summary generation failed - $errors call(s) failed and no summary was generated. The backlog is not draining."
          elif [ "$errors" != "0" ]; then
            # Partial failure stays green by design (see check_summary_yield):
            # these votes keep summary_plain IS NULL and are retried tomorrow.
            echo "::warning::$generated summaries generated, $errors failed - the failed votes stay in the backlog and retry on the next run."
          fi
          exit "$status"

      - name: Revalidate frontend cache
        # Runs when summaries were generated so vote cards show updated summary_plain immediately.
        #
        # Scoped since GH #353. This job only ever rewrites `summary_plain` /
        # `theme` on the handful of votes whose generation failed earlier, so it
        # sends the `summaries` family plus those vote ids. It must not send the
        # `votes` family: that one carries the `health` tag, which the root
        # layout's freshness badge reads, so it would purge every page on the
        # site for one retried sentence - and `last_ingestion` (MAX(voted_at))
        # has not moved anyway.
        #
        # Deputy pages are deliberately not purged here either; see the
        # "deliberate gap" note in frontend/src/lib/cacheTags.ts.
        if: steps.summarize.outputs.generated != '0' && steps.summarize.outputs.generated != ''
        id: revalidate
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$FRONTEND_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            # An unreadable or missing id file yields an empty body, which the
            # endpoint reads as the full conservative purge - the same
            # over-purge-on-doubt rule ingest_prod.yml follows.
            scope=$(python -m scripts.build_summary_scope /tmp/summarized_vote_ids.txt || echo "")
            echo "Cache scope: ${scope:-full purge}"
            curl -sf --retry 3 --retry-delay 10 --retry-all-errors \
              -X POST "$FRONTEND_URL/api/revalidate" \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              -H "Content-Type: application/json" \
              --data "$scope"
            echo "Frontend cache revalidated."
            {
              echo "## Cache invalidation"
              echo ""
              echo "Scope: ${scope:-full purge (no id file)}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FRONTEND_URL or REVALIDATE_SECRET not set — skipping revalidation."
          fi

      - name: Report failed revalidation
        # Warning, not fatal, unlike the same step in ingest_prod.yml: this
        # workflow is the summary retry backstop (MON-221), and the next
        # ingestion run purges the cache anyway. Silence was the actual gap -
        # freshly generated summaries stayed invisible for up to a day with no
        # signal at all (GH #352).
        if: ${{ !cancelled() && steps.revalidate.outcome == 'failure' }}
        run: |
          echo "::warning::Frontend cache revalidation failed - new summaries stay invisible until the next successful purge."
          {
            echo "## ⚠️ Frontend cache not revalidated"
            echo ""
            echo "Summaries were generated but the purge failed, so vote cards keep serving the previous build (up to 24h - see frontend/src/lib/cachePolicy.ts)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write job summary
        if: always()
        run: |
          remaining_before="${{ steps.backlog.outputs.remaining }}"
          generated="${{ steps.summarize.outputs.generated || '0' }}"
          errors="${{ steps.summarize.outputs.errors || '0' }}"
          today=$(date -u +%Y-%m-%d)

          if [ "$remaining_before" = "0" ]; then
            status="complete"
          elif [ "$generated" = "0" ] && [ "$errors" -gt "0" ] 2>/dev/null; then
            # Red since GH #384 - the step above exits non-zero on this shape.
            status="failed"
          elif [ "$generated" -gt "0" ] 2>/dev/null; then
            status="progress"
          else
            status="skipped"
          fi

          {
            echo "## Summary Backfill — $today"
            echo ""
            echo "| Date (UTC) | Remaining | Generated | Errors | Status |"
            echo "|------------|-----------|-----------|--------|--------|"
            echo "| $today | $remaining_before | $generated | $errors | $status |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Logged: $today | remaining=$remaining_before | generated=$generated | errors=$errors | status=$status"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Summary backfill failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
