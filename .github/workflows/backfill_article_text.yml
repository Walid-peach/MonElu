# One-off, safe to re-run (#642, ADR-044): attaches official text to every
# article vote in production, clears the summaries written from a title alone,
# then rebuilds the marts so the site stops showing them in the same run. The
# daily runs rewrite them from the official text, ahead of the amendment backlog.
name: MonÉlu — Backfill Article Text

on:
  workflow_dispatch:

concurrency:
  group: summaries
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ingest.txt

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt "dbt-core>=1.9,<1.10" "dbt-postgres>=1.9,<1.10"

      - name: Attach official text
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest_articles.py --since 2024-07-07

      - name: Clear summaries written from a title alone
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.generate_vote_summaries --clear-legacy-articles

      - name: Create dbt profiles.yml
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_PORT: ${{ secrets.DBT_PORT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: python3 scripts/create_dbt_profile.py

      - name: Rebuild the marts
        run: |
          cd transform
          dbt deps
          dbt run --profiles-dir . --target prod

      - name: Revalidate frontend cache
        # An empty body is the full purge: this rewrites hundreds of votes.
        # A failure here only delays the pages by a day, so it does not fail the run.
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$FRONTEND_URL/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET"
