name: MonÉlu Production Ingestion

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Once per day at 06:00 UTC, weekdays only
  workflow_dispatch:           # Manual trigger button

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          missing=()
          [ -z "$DATABASE_URL" ]      && missing+=(DATABASE_URL)
          [ -z "$OPENAI_API_KEY" ]    && missing+=(OPENAI_API_KEY)
          [ -z "$GROQ_API_KEY" ]      && missing+=(GROQ_API_KEY)
          [ -z "$SENDGRID_API_KEY" ]  && missing+=(SENDGRID_API_KEY)
          # AN_API_BASE_URL and SENDGRID_FROM_EMAIL are optional — scripts have fallbacks
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-ingest.txt
            requirements-rag.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingestion
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AN_API_BASE_URL: ${{ secrets.AN_API_BASE_URL }}
        run: python scripts/run_ingestion_prod.py --since $(date -d '30 days ago' +%Y-%m-%d)

      - name: Install RAG dependencies
        if: steps.ingest.outputs.new_votes != '0'
        run: pip install -r requirements-rag.txt

      - name: Rebuild RAG index
        if: steps.ingest.outputs.new_votes != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m rag.pipeline.index_manager build --since $(date -d '30 days ago' +%Y-%m-%d)

      - name: Install dbt
        if: steps.ingest.outputs.new_votes != '0'
        run: pip install "dbt-core>=1.9,<1.10" "dbt-postgres>=1.9,<1.10"

      - name: Write dbt profiles.yml
        if: steps.ingest.outputs.new_votes != '0'
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_PORT: ${{ secrets.DBT_PORT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: |
          python3 <<'PYEOF'
          import os, pathlib
          port = int(os.environ.get("DBT_PORT") or "5432")
          host = os.environ["DBT_HOST"]
          user = os.environ["DBT_USER"]
          password = os.environ["DBT_PASSWORD"]
          dbname = os.environ["DBT_DBNAME"]
          content = f"""transform:
            target: prod
            outputs:
              prod:
                type: postgres
                host: "{host}"
                port: {port}
                user: "{user}"
                password: "{password}"
                dbname: "{dbname}"
                schema: analytics
                threads: 4
                connect_timeout: 10
          """
          pathlib.Path("transform/profiles.yml").write_text(content)
          PYEOF

      - name: Run dbt transformations
        if: steps.ingest.outputs.new_votes != '0'
        run: |
          cd transform
          dbt deps --profiles-dir .
          dbt run --profiles-dir . --target prod
          dbt test --profiles-dir . --target prod

      - name: Run vote alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        run: python scripts/run_alerts.py 360
        # 360 minutes = 6 hours (matches cron interval)

      - name: Notify success
        run: echo "Ingestion completed at $(date)"
