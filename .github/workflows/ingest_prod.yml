name: MonÉlu Production Ingestion

on:
  schedule:
    - cron: '0 */6 * * 1-5'  # Every 6 hours, weekdays only
  workflow_dispatch:           # Manual trigger button

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=()
          [ -z "$DATABASE_URL" ]   && missing+=(DATABASE_URL)
          [ -z "$OPENAI_API_KEY" ] && missing+=(OPENAI_API_KEY)
          [ -z "$GROQ_API_KEY" ]   && missing+=(GROQ_API_KEY)
          # AN_API_BASE_URL is optional — the script has a hardcoded fallback
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # AN_API_BASE_URL is intentionally omitted — the script defaults to
          # https://data.assemblee-nationale.fr. Injecting an unset secret
          # would pass an empty string and override that default.
        run: python scripts/run_ingestion_prod.py --since $(date -d '30 days ago' +%Y-%m-%d)

      - name: Rebuild RAG index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m rag.pipeline.index_manager build

      - name: Notify success
        run: echo "Ingestion completed at $(date)"
