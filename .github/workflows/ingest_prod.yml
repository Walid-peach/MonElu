name: MonÉlu Production Ingestion

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Once per day at 06:00 UTC, weekdays only
  workflow_dispatch:           # Manual trigger button

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=()
          [ -z "$DATABASE_URL" ]   && missing+=(DATABASE_URL)
          [ -z "$OPENAI_API_KEY" ] && missing+=(OPENAI_API_KEY)
          [ -z "$GROQ_API_KEY" ]   && missing+=(GROQ_API_KEY)
          # AN_API_BASE_URL is optional — the script has a hardcoded fallback
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-ingest.txt
            requirements-rag.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingestion
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AN_API_BASE_URL: ${{ secrets.AN_API_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/run_ingestion_prod.py --since $(python3 -c "from datetime import date, timedelta; print(date.today() - timedelta(days=30))")

      - name: Install RAG dependencies
        if: steps.ingest.outputs.new_votes != '0'
        run: pip install -r requirements-rag.txt

      - name: Rebuild RAG index
        if: steps.ingest.outputs.new_votes != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m rag.pipeline.index_manager build --since $(python3 -c "from datetime import date, timedelta; print(date.today() - timedelta(days=30))")

      # dbt install + profile run unconditionally: snapshots and source
      # freshness below must run even on no-new-votes days (freshness exists
      # to alarm on silence; party changes arrive without new votes).
      - name: Install dbt
        run: pip install "dbt-core>=1.9,<1.10" "dbt-postgres>=1.9,<1.10"

      - name: Write dbt profiles.yml
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_PORT: ${{ secrets.DBT_PORT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: |
          python3 <<'PYEOF'
          import os, pathlib
          port = int(os.environ.get("DBT_PORT") or "5432")
          host = os.environ["DBT_HOST"]
          user = os.environ["DBT_USER"]
          password = os.environ["DBT_PASSWORD"]
          dbname = os.environ["DBT_DBNAME"]
          content = f"""transform:
            target: prod
            outputs:
              prod:
                type: postgres
                host: "{host}"
                port: {port}
                user: "{user}"
                password: "{password}"
                dbname: "{dbname}"
                schema: analytics
                threads: 4
                connect_timeout: 10
          """
          pathlib.Path("transform/profiles.yml").write_text(content)
          PYEOF

      - name: Run dbt transformations
        if: steps.ingest.outputs.new_votes != '0'
        run: |
          cd transform
          dbt deps --profiles-dir .
          dbt run --profiles-dir . --target prod
          dbt test --profiles-dir . --target prod

      - name: dbt snapshot + source freshness
        # Unconditional: captures party changes (which land without new votes)
        # and fails loudly when ingestion has been silent past the freshness
        # error windows in sources.yml.
        run: |
          cd transform
          dbt deps --profiles-dir .
          dbt snapshot --profiles-dir . --target prod
          dbt source freshness --profiles-dir . --target prod

      - name: Revalidate frontend cache
        # Runs unconditionally so deputy/party profile fixes (update_party.py,
        # run inside run_ingestion_prod.py) also purge the cache, not just new-vote runs.
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$FRONTEND_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -sf -X POST "$FRONTEND_URL/api/revalidate" \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              -H "Content-Type: application/json"
            echo "Frontend cache revalidated."
          else
            echo "FRONTEND_URL or REVALIDATE_SECRET not set — skipping revalidation."
          fi

      - name: Notify success
        run: echo "Ingestion completed at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Daily ingestion failed — data will go stale until fixed."
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "## ❌ Ingestion failed" >> "$GITHUB_STEP_SUMMARY"
          echo "See the failed step above. Data goes stale until this is fixed." >> "$GITHUB_STEP_SUMMARY"
